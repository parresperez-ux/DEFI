<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0a"><title>Rosa Nera — Collection</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0a;color:#f4eee4;font:15px Arial,sans-serif}main{max-width:760px;margin:auto;padding:0 16px 40px}header{height:82px;display:flex;align-items:center;justify-content:space-between}button,a{color:inherit;background:#191917;border:1px solid #48463f;border-radius:24px;padding:10px 14px;cursor:pointer}h1,h2,strong{font:normal 26px Georgia,serif;margin:0}small{display:block;letter-spacing:.24em;text-transform:uppercase;color:#b8afa2;font-size:9px;margin-top:4px}header div{text-align:center}#grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 12px}#grid.single{display:flex;overflow-x:auto;scroll-snap-type:x mandatory}.single article{flex:0 0 100%;scroll-snap-align:center}article button{display:block;background:none;padding:0;border:0;text-align:left;width:100%}.cover{position:relative;overflow:hidden;border-radius:16px;aspect-ratio:9/16;background:#161613}.cover img,#media>*{width:100%;height:100%;object-fit:cover}.cover span{position:absolute;inset:auto 0 0;padding:28px 10px 14px;display:flex;justify-content:space-between;background:linear-gradient(transparent,#000b)}strong{display:block;margin-top:10px;font-size:19px}dialog{border:0;padding:0;background:#111;color:white;width:100%;height:100dvh;max-width:540px;max-height:none}dialog::backdrop{background:#000d}#media{height:100%;touch-action:pan-x}aside,footer{position:absolute;left:0;right:0;padding:16px;display:flex;gap:8px}aside{top:0;justify-content:space-between}footer{bottom:0;display:block;background:linear-gradient(transparent,#000e 35%);padding:55px 20px max(22px,env(safe-area-inset-bottom))}footer a{display:inline-block;text-decoration:none}button:disabled{opacity:.45}
</style><script src="https://telegram.org/js/telegram-web-app.js"></script>
